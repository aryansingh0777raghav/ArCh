<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ArCh</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            user-select: none;
            -webkit-user-drag: none;
        }
        body {
            background-color: transparent;
            color: #ffffff;
            font-family: 'Outfit', 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            overflow: hidden;
        }
        .splash-card {
            background: rgba(12, 12, 14, 0.95);
            border: 1px solid rgba(255, 255, 255, 0.08);
            border-radius: 20px;
            width: 440px;
            height: 290px;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            box-shadow: 0 20px 50px rgba(0, 0, 0, 0.8), 
                        0 0 40px rgba(0, 242, 254, 0.05);
            position: relative;
            padding: 20px;
        }
        .logo-container {
            display: flex;
            align-items: center;
            justify-content: center;
            margin-bottom: 15px;
            position: relative;
        }
        .logo-icon {
            font-size: 42px;
            font-weight: 800;
            background: linear-gradient(135deg, #00f2fe 0%, #4facfe 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            letter-spacing: -2px;
            filter: drop-shadow(0 0 10px rgba(0, 242, 254, 0.3));
            animation: pulse 2s infinite ease-in-out;
        }
        .logo-icon span {
            font-weight: 300;
            color: #ffffff;
            -webkit-text-fill-color: #ffffff;
        }
        .tagline {
            font-size: 13px;
            color: rgba(255, 255, 255, 0.6);
            letter-spacing: 3px;
            text-transform: uppercase;
            margin-bottom: 30px;
            font-weight: 500;
        }
        .loader-bar {
            width: 200px;
            height: 3px;
            background: rgba(255, 255, 255, 0.05);
            border-radius: 10px;
            overflow: hidden;
            position: relative;
        }
        .loader-progress {
            width: 100%;
            height: 100%;
            background: linear-gradient(90deg, #00f2fe, #4facfe);
            border-radius: 10px;
            position: absolute;
            left: -100%;
            animation: loading 2s infinite cubic-bezier(0.4, 0, 0.2, 1);
        }
        .developer {
            position: absolute;
            bottom: 20px;
            font-size: 10px;
            color: rgba(255, 255, 255, 0.35);
            letter-spacing: 1px;
            text-transform: uppercase;
        }
        @keyframes pulse {
            0%, 100% {
                transform: scale(1);
                filter: drop-shadow(0 0 10px rgba(0, 242, 254, 0.3));
            }
            50% {
                transform: scale(1.03);
                filter: drop-shadow(0 0 20px rgba(0, 242, 254, 0.6));
            }
        }
        @keyframes loading {
            0% {
                left: -100%;
            }
            50% {
                left: 0%;
            }
            100% {
                left: 100%;
            }
        }
    </style>
</head>
<body>
    <div class="splash-card">
        <div class="logo-container">
            <div class="logo-icon">Ar<span>Ch</span></div>
        </div>
        <div class="tagline">Search Smarter. Think Faster.</div>
        <div class="loader-bar">
            <div class="loader-progress"></div>
        </div>
        <div class="developer">Developed by Aryan Singh</div>
    </div>
</body>
</html>
